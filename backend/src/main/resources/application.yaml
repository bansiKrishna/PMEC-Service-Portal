
spring:
  application:
    name: PMEC-Service-Portal

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]

  # ========================================
  # Supabase
  # ========================================
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # Hikari connection pool
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1500000
      keepalive-time: 240000

      # Supabase transaction pooler compatibility
      data-source-properties:
        prepareThreshold: 0

  # ========================================
  # JPA / Hibernate
  # ========================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# ========================================
# JWT
# ========================================
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ========================================
# COLLEGE EMAIL
# ========================================
college:
  email:
    domain: "pmec.ac.in"

# ========================================
# SERVER
# ========================================
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload-dir: ${APP_UPLOAD_DIR:uploads/semester-registration/receipts}


logging:
  level:
    org.springframework.transaction: WARN
    org.springframework.orm.jpa: WARN
    org.hibernate.SQL: WARN
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: WARN
    com.zaxxer.hikari: INFO