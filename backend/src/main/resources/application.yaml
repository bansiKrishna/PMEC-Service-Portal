
spring:
  application:
    name: PMEC-Service-Portal

  config:
    import: optional:file:./.env[.properties]

  # ========================================
  # Supabase
  # ========================================
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # Hikari connection pool
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000

  # ========================================
  # JPA / Hibernate
  # ========================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# ========================================
# JWT
# ========================================
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ========================================
# COLLEGE EMAIL
# ========================================
college:
  email:
    domain: "pmec.ac.in"

# ========================================
# SERVER
# ========================================
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}